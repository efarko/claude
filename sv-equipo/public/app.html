<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f4f5f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#070a14" media="(prefers-color-scheme: dark)">
<title>SV Equipo · Mi ronda</title>
<link rel="preload" href="/assets/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<header class="topbar"><div class="in">
  <a class="brand" href="/app"><span class="mark" aria-hidden="true">SV</span>SV Equipo</a>
  <div class="top-actions">
    <span class="who" id="who"></span>
    <a class="link-btn" href="/panel" id="to-panel" hidden>Panel</a>
    <button class="link-btn" id="out" title="Salir"></button>
  </div>
</div></header>

<div class="shell">
  <aside class="side">
    <div class="hello">
      <p class="eyebrow">Ronda de hoy</p>
      <h1 id="hello" style="margin-top:10px">Tu ronda</h1>
      <p class="sub" id="day"></p>
    </div>
    <div class="tabs" role="tablist" aria-label="Tipo de contacto">
      <button class="tab" role="tab" id="t-wa" aria-selected="true">
        <span class="t-row"><span id="t-wa-l">WhatsApp</span><span class="count" id="c-wa"></span></span>
        <span class="meter"><span id="m-wa" style="width:0"></span></span>
      </button>
      <button class="tab" role="tab" id="t-calls" aria-selected="false">
        <span class="t-row"><span id="t-calls-l">Llamadas</span><span class="count" id="c-calls"></span></span>
        <span class="meter brand"><span id="m-calls" style="width:0"></span></span>
      </button>
    </div>
    <div class="stat-card" id="stats"></div>
    <p class="hint side-tip"><b>Tip:</b> los números se reparten solos cada día y nadie más del equipo los tiene. Lo que no envíes hoy vuelve a la bolsa mañana.</p>
  </aside>

  <main class="main">
    <section id="v-wa"></section>
    <section id="v-calls" hidden></section>
  </main>
</div>

<script type="module">
import { api, h, toast, logout, fmtTime, fmtDay, icon, initials } from '/assets/common.js';
const $ = (id) => document.getElementById(id);
let data, tab = sessionStorage.getItem('sv-tab') || 'wa';
$('out').append(icon('out'), h('span', {}, 'Salir'));
$('out').onclick = logout;
$('t-wa-l').prepend(icon('wa'));
$('t-calls-l').prepend(icon('phone'));

const needChip = (need) => need === 'nueva' ? h('span', { class: 'chip new' }, 'Web nueva') : h('span', { class: 'chip' }, 'Arreglo');
const resChip = (r) => ({
  interested: h('span', { class: 'chip ok' }, 'Interesado'),
  not_interested: h('span', { class: 'chip bad' }, 'No interesado'),
  no_answer: h('span', { class: 'chip gray' }, 'No contestó'),
})[r] || null;

async function load() {
  try { data = await api('closer?a=today'); } catch (e) { toast(e.message); return; }
  const u = data.user;
  $('hello').textContent = `Hola, ${u.name.split(' ')[0]}`;
  $('day').textContent = fmtDay(data.day).replace(/^./, (c) => c.toUpperCase());
  $('who').replaceChildren(h('span', { class: 'avatar' }, initials(u.name)), h('span', { class: 'who-name' }, u.role));
  $('to-panel').hidden = !u.isOwner;
  $('t-wa').hidden = !u.canWa;
  $('t-calls').hidden = !u.canCalls;
  if (tab === 'wa' && !u.canWa) tab = 'calls';
  if (tab === 'calls' && !u.canCalls) tab = 'wa';
  render();
}

function setTab(t) { tab = t; sessionStorage.setItem('sv-tab', t); render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
$('t-wa').onclick = () => setTab('wa');
$('t-calls').onclick = () => setTab('calls');

function render() {
  $('t-wa').setAttribute('aria-selected', tab === 'wa');
  $('t-calls').setAttribute('aria-selected', tab === 'calls');
  $('v-wa').hidden = tab !== 'wa';
  $('v-calls').hidden = tab !== 'calls';
  const sent = data.wa.filter((w) => w.sent).length;
  const waInt = data.wa.filter((w) => w.result === 'interested').length;
  $('c-wa').textContent = `${sent}/${data.wa.length}`;
  $('m-wa').style.width = data.wa.length ? `${(sent / data.wa.length) * 100}%` : '0';
  const c = data.calls;
  if (c) {
    $('c-calls').textContent = c.pending ? `${c.pos}/${c.total}` : `${c.done.length} hechas`;
    $('m-calls').style.width = c.pending ? `${((c.pos - 1) / c.total) * 100}%` : c.batch ? '100%' : '0';
  }
  const callInt = c ? c.done.filter((d) => d.result === 'interested').length : 0;
  $('stats').replaceChildren(
    h('p', { class: 'label', style: 'margin:0' }, 'Tu día'),
    h('div', { class: 'stat' }, 'WhatsApp enviados', h('b', {}, `${sent}`)),
    c ? h('div', { class: 'stat' }, 'Llamadas hechas', h('b', {}, `${c.done.length}`)) : null,
    h('div', { class: 'stat' }, 'Interesados', h('b', { style: 'color:var(--accent-ink)' }, `${waInt + callInt}`)),
  );
  if (tab === 'wa') renderWa(); else if (c) renderCalls();
}

function renderWa() {
  const v = $('v-wa');
  v.replaceChildren();
  if (!data.wa.length) {
    v.append(h('div', { class: 'empty' }, 'Hoy no quedan números para WhatsApp. Ya le avisamos a Franco para que cargue más.'));
    return;
  }
  const pending = data.wa.filter((w) => !w.sent), done = data.wa.filter((w) => w.sent && w.result !== 'already');
  v.append(h('div', { class: 'page-head' },
    h('div', {}, h('p', { class: 'eyebrow' }, icon('wa'), 'WhatsApp'), h('h2', { style: 'margin:0;font-size:26px' }, pending.length ? `Te quedan ${pending.length} por enviar` : '¡Enviaste todos los de hoy!')),
  ));
  v.append(h('p', { class: 'hint', style: 'margin-bottom:18px' },
    h('b', {}, 'Cómo funciona: '), 'toca «Enviar por WhatsApp»: se abre tu WhatsApp con el mensaje listo y solo le das enviar. Si te responden, márcalo aquí.'));
  v.append(pending.length ? h('div', { class: 'grid' }, pending.map(waCard)) : h('div', { class: 'empty' }, '¡Listo! Enviaste todos los de hoy 🎉 Revisa abajo quién te respondió.'));
  if (done.length) {
    v.append(h('h2', {}, 'Enviados', h('small', {}, `${done.length}`)));
    v.append(h('div', { class: 'grid' }, done.map(waCard)));
  }
}

function waCard(w) {
  const card = h('article', { class: 'card' + (w.sent && w.result ? ' done' : '') },
    h('div', { class: 'row' }, h('div', { style: 'min-width:0' }, h('div', { class: 'name' }, w.name), h('p', { class: 'problem' }, w.problem || '')), w.demo ? h('a', { class: 'chip ok', href: w.demo, target: '_blank', rel: 'noopener' }, 'Muestra lista') : needChip(w.need)),
  );
  if (!w.sent) {
    const send = h('a', { class: 'btn grow', href: w.link, target: '_blank', rel: 'noopener' }, icon('wa'), 'Enviar por WhatsApp');
    send.addEventListener('click', () => {
      fetch('/api/closer?a=wa_sent', { method: 'POST', keepalive: true, headers: { 'Content-Type': 'application/json', 'X-SV': '1' }, body: JSON.stringify({ id: w.id }) })
        .then((r) => { if (!r.ok) throw 0; w.sent = true; setTimeout(render, 400); })
        .catch(() => toast('No se pudo marcar como enviado. Recarga la página.'));
    });
    card.append(h('div', { class: 'actions' }, send, h('span', { class: 'num muted' }, w.phone)));
    const skip = h('button', { class: 'link-btn', style: 'padding:4px 0;font-size:13px' }, 'Ya le había escrito antes');
    skip.onclick = async () => {
      if (!confirm(`¿Ya le habías escrito a ${w.name}? Lo quitamos de tu lista y te damos otro número en su lugar.`)) return;
      skip.disabled = true;
      try { await api('closer?a=wa_skip', { id: w.id }); toast('Listo, te dimos otro número.'); await load(); }
      catch (e) { toast(e.message); skip.disabled = false; }
    };
    card.append(h('div', { class: 'row', style: 'align-items:center' }, h('details', {}, h('summary', {}, 'Ver el mensaje'), h('p', { class: 'bubble', style: 'margin-top:10px' }, w.msg)), skip));
  } else if (!w.result) {
    card.append(h('div', { class: 'small muted', style: 'display:flex;align-items:center;gap:6px' }, icon('check'), 'Enviado. ¿Te respondió?'));
    const mark = (result) => async (e) => {
      let note = null;
      if (result === 'interested') note = prompt('Nota para Franco (opcional): ¿qué dijo, con quién hablaste?') ?? null;
      const btn = e.currentTarget;
      btn.disabled = true;
      try { await api('closer?a=wa_result', { id: w.id, result, note }); w.result = result; toast(result === 'interested' ? '¡Bien! Le avisamos a Franco.' : 'Anotado.'); render(); }
      catch (err) { toast(err.message); btn.disabled = false; }
    };
    card.append(h('div', { class: 'actions' },
      h('button', { class: 'btn sm grow', onclick: mark('interested') }, icon('star'), 'Le interesa'),
      h('button', { class: 'btn sm ghost grow', onclick: mark('not_interested') }, 'No le interesa')));
  } else {
    card.append(h('div', { class: 'row' }, h('span', { class: 'small muted' }, 'Enviado'), resChip(w.result)));
  }
  return card;
}

function renderCalls() {
  const v = $('v-calls'), c = data.calls;
  v.replaceChildren();
  const cur = c.current;
  if (cur) {
    v.append(h('div', { class: 'page-head' },
      h('div', {}, h('p', { class: 'eyebrow' }, icon('phone'), `Bloque ${c.batch} · llamada ${c.pos} de ${c.total}`),
        h('h2', { style: 'margin:0;font-size:26px' }, cur.attempts ? `Intento ${cur.attempts + 1}: vuelve a llamar` : 'Tu llamada actual')),
    ));
    v.append(callCard(cur));
    if (c.pending > 1) {
      v.append(h('h2', {}, 'Siguientes', h('small', {}, `${c.pending - 1} bloqueados`)));
      v.append(h('p', { class: 'small muted', style: 'margin:-4px 0 10px' }, 'Se desbloquean de uno en uno cuando marcas el resultado de la llamada actual.'));
      const start = c.pos + 1;
      v.append(h('div', { class: 'locked', 'aria-label': `${c.pending - 1} llamadas bloqueadas` },
        Array.from({ length: c.pending - 1 }, (_, i) => h('span', { title: 'Bloqueado' }, String(start + i)))));
    }
  } else {
    const box = h('div', { class: 'card hot', style: 'text-align:center;justify-items:center;padding:36px 24px' });
    box.append(h('p', { class: 'eyebrow' }, icon('phone'), 'Llamadas'));
    if (c.canMore) {
      box.append(h('h2', { style: 'margin:0;font-size:26px;display:block' }, c.batch ? `¡Terminaste el bloque ${c.batch}! 💪` : 'Listo para llamar'),
        h('p', { class: 'sub' }, `Puedes pedir ${c.batchSize} números más.`));
      const b = h('button', { class: 'btn', style: 'min-width:240px' }, `Generar ${c.batchSize} más`);
      b.onclick = async () => { b.disabled = true; try { await api('closer?a=more_calls', {}); await load(); } catch (e) { toast(e.message); b.disabled = false; } };
      box.append(b);
    } else {
      box.append(h('h2', { style: 'margin:0;font-size:26px;display:block' }, c.batch ? `¡Terminaste el bloque ${c.batch}! 💪` : 'Sin números por ahora'),
        h('p', { class: 'sub' }, 'Por hoy no quedan más números para llamar. Ya le avisamos a Franco para que cargue más.'));
    }
    v.append(box);
  }
  if (c.done.length) {
    v.append(h('h2', {}, 'Llamadas de hoy', h('small', {}, `${c.done.length}`)));
    v.append(h('div', { class: 'grid' }, c.done.map((d) => h('div', { class: 'card flat' },
      h('div', { class: 'row', style: 'align-items:center' }, h('span', { class: 'name', style: 'font-size:15px' }, d.name), resChip(d.result)),
      d.note ? h('span', { class: 'small muted' }, d.note) : null,
      h('span', { class: 'small muted num' }, fmtTime(d.at))))));
  }
}

function callCard(p) {
  let dialed = p.dialed;
  const results = h('div', { class: 'results' });
  const note = h('textarea', { class: 'input', placeholder: 'Nota (opcional): con quién hablaste, a qué número enviar la muestra…', maxlength: '500', rows: '2' });
  const lockHint = h('p', { class: 'hint warn', style: 'display:flex;gap:8px;align-items:flex-start' }, icon('lock'), h('span', {}, 'Toca «Llamar» primero. Después marca cómo te fue para ver el siguiente número.'));
  const opts = [['interested', 'Interesado', 'ok'], ['not_interested', 'No interesado', 'bad'], ['no_answer', 'No contestó', 'na']];
  const btns = opts.map(([r, label, cls]) => h('button', { class: `res ${cls}`, disabled: !dialed, onclick: () => send(r, label) }, label));
  results.append(...btns);
  const unlock = () => { dialed = true; btns.forEach((b) => (b.disabled = false)); lockHint.hidden = true; };
  if (dialed) lockHint.hidden = true;

  const phones = h('div', { class: 'actions' }, (p.phones || []).map((ph) => {
    const a = h('a', { class: 'btn dark grow', href: 'tel:' + ph.tel }, icon('phone'), `Llamar · ${ph.label}`, h('span', { class: 'num' }, ph.show));
    a.addEventListener('click', () => {
      fetch('/api/closer?a=dial', { method: 'POST', keepalive: true, headers: { 'Content-Type': 'application/json', 'X-SV': '1' }, body: JSON.stringify({ id: p.id }) }).catch(() => {});
      setTimeout(unlock, 300);
    });
    return a;
  }));

  const left = h('div', { class: 'call-col' },
    h('div', { class: 'row' }, h('div', { style: 'min-width:0' }, h('div', { class: 'name', style: 'font-size:22px' }, p.name), h('p', { class: 'problem' }, p.problem || '')), needChip(p.need)),
    p.waDone ? h('p', { class: 'hint ok', style: 'display:flex;gap:8px' }, icon('wa'), h('span', {}, 'Ya le escribieron por WhatsApp: pregúntale si vio el mensaje.')) : null,
    phones,
    h('div', {}, h('p', { class: 'label' }, '¿Cómo te fue?'), results),
    lockHint,
    note,
  );
  const right = h('div', { class: 'call-col script-col' },
    h('p', { class: 'label', style: 'margin:0' }, 'Qué decir'),
    h('div', { class: 'script' }, p.script.filter((s) => s.main).map((s) => h('div', { class: 'step' }, h('b', {}, s.t), s.s))),
    h('details', {}, h('summary', {}, 'Si te dice… (respuestas rápidas)'), h('div', { class: 'script', style: 'margin-top:10px' }, p.script.filter((s) => !s.main).map((s) => h('div', { class: 'step' }, h('b', {}, s.t), s.s)))),
  );
  const card = h('article', { class: 'card hot call', style: 'padding:22px' }, left, right);

  async function send(result, label) {
    if (result === 'no_answer' && !confirm('¿No contestó? Se volverá a llamar otro día.')) return;
    btns.forEach((b) => (b.disabled = true));
    try {
      await api('closer?a=call_result', { id: p.id, result, note: note.value });
      toast(result === 'interested' ? '¡Excelente! Le avisamos a Franco.' : `Anotado: ${label}`);
      await load();
      window.scrollTo({ top: 0 });
    } catch (e) {
      toast(e.message);
      btns.forEach((b) => (b.disabled = !dialed));
    }
  }
  return card;
}

load();
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && data) load(); });
</script>
</body>
</html>
